<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#7C6FCD" />
  <meta name="description" content="Portal Kas Villa — Admin & Anggota" />
  <title>Masuk — Kas Villa</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>
  <div id="app-loading" class="app-loading">
    <div class="spinner"></div>
    <p style="color:var(--text-muted);font-size:0.9rem">Memuat data villa…</p>
  </div>

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <h1><i class="ti ti-home-heart"></i> <span id="brand-name">Kas Villa</span></h1>
        <p>Kelola iuran villa — portal admin & anggota</p>
        <div class="sync-pill" data-sync-status style="margin-top:12px;justify-content:center">
          <span class="sync-dot"></span><span class="sync-label">Memuat…</span>
        </div>
      </div>

      <div class="role-tabs">
        <button type="button" class="role-tab active" data-role="admin">Admin</button>
        <button type="button" class="role-tab" data-role="customer">Anggota</button>
      </div>

      <form id="form-admin" class="login-form active" onsubmit="return loginAdmin(event)">
        <div class="form-group">
          <label>Username Admin</label>
          <input type="text" id="admin-user" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="admin-pass" autocomplete="current-password" required />
        </div>
        <p class="hint"></p>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px">
          <i class="ti ti-shield-lock"></i> Masuk sebagai Admin
        </button>
      </form>

      <form id="form-customer" class="login-form" onsubmit="return loginCustomer(event)">
        <div class="form-group">
          <label>Nomor WhatsApp</label>
          <input type="tel" id="cust-phone" placeholder="628123456789" required />
        </div>
        <div class="form-group">
          <label>PIN Anggota</label>
          <input type="password" id="cust-pin" maxlength="6" placeholder="4 digit" required />
        </div>
        <p class="hint">PIN diberikan admin. Hubungi admin jika lupa.</p>
        <button type="submit" class="btn btn-success" style="width:100%; margin-top:8px">
          <i class="ti ti-user-circle"></i> Masuk Anggota
        </button>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/sync.js"></script>
  <script>
    initData().then(() => {
      showAppLoading(false);
      document.getElementById('brand-name').textContent = state.config.villaName || 'Kas Villa';
      const existing = getSession();
      if (existing?.role === 'admin') window.location.href = 'admin/index.html';
      if (existing?.role === 'customer') window.location.href = 'customer/index.html';
    });

    document.querySelectorAll('.role-tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.role-tab').forEach((t) => t.classList.remove('active'));
        tab.classList.add('active');
        const role = tab.dataset.role;
        document.getElementById('form-admin').classList.toggle('active', role === 'admin');
        document.getElementById('form-customer').classList.toggle('active', role === 'customer');
      });
    });

    function loginAdmin(e) {
      e.preventDefault();
      const user = document.getElementById('admin-user').value.trim();
      const pass = document.getElementById('admin-pass').value;
      if (user === state.config.adminUser && pass === state.config.adminPass) {
        setSession({ role: 'admin', name: 'Administrator' });
        logActivity('Admin masuk ke sistem', 'Admin');
        window.location.href = 'admin/index.html';
      } else {
        alert('Username atau password salah.');
      }
      return false;
    }

    function loginCustomer(e) {
      e.preventDefault();
      const phone = normalizePhone(document.getElementById('cust-phone').value);
      const pin = document.getElementById('cust-pin').value.trim();
      const member = findMemberByPhone(phone);
      if (!member) {
        alert('Nomor tidak terdaftar. Hubungi admin villa.');
        return false;
      }
      const realPin = ensureMemberPin(member);
      if (pin !== realPin) {
        alert('PIN salah. Hubungi admin jika lupa PIN.');
        return false;
      }
      setSession({ role: 'customer', memberId: member.id, name: member.name });
      logActivity(`Anggota ${member.name} masuk portal`, member.name);
      window.location.href = 'customer/index.html';
      return false;
    }
  </script>
</body>
</html>
